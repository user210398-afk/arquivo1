name: Sincronizar Simulados e Manifesto

on:
  push:
    paths:
      - '*.html'

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 1. Atualizar lista no index.html
        run: |
          python -c "
          import os, re

          arquivos = [
              f for f in sorted(os.listdir('.')) 
              if f.lower().endswith('.html') and f.lower() != 'index.html'
          ]

          linhas_js = [f\"      '{arq}'\" for arq in arquivos]
          bloco_novo = ',\n'.join(linhas_js)

          with open('index.html', 'r', encoding='utf-8') as f:
              conteudo = f.read()

          padrao = r'/\* INICIO_LISTA \*/.*?/\* FIM_LISTA \*/'
          substituicao = f'/* INICIO_LISTA */\n{bloco_novo}\n      /* FIM_LISTA */'

          conteudo_atualizado = re.sub(padrao, substituicao, conteudo, flags=re.DOTALL)

          with open('index.html', 'w', encoding='utf-8') as f:
              f.write(conteudo_atualizado)
          "

      - name: 2. Gerar simulados.json
        run: |
          python -c "
          import os, json, re

          simulados = []
          for arq in sorted(os.listdir('.')):
              if arq.lower().endswith('.html') and arq.lower() != 'index.html':
                  with open(arq, 'r', encoding='utf-8', errors='ignore') as f:
                      html = f.read()
                  
                  match_titulo = re.search(r'<title>(.*?)</title>', html, re.IGNORECASE)
                  titulo = match_titulo.group(1).strip() if match_titulo else arq

                  simulados.append({
                      'arquivo': arq,
                      'titulo': titulo
                  })

          with open('simulados.json', 'w', encoding='utf-8') as f:
              json.dump(simulados, f, ensure_ascii=False, indent=2)
          "

      - name: Salvar alterações no repositório
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html simulados.json
          git commit -m "auto: sincroniza index.html e simulados.json [skip ci]" || echo "Sem alterações para salvar"
          git push
