name: Sincronizar Simulados e Manifesto

on:
  push:
    paths:
      - '*.html'

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 1. Atualizar lista no index.html
        run: |
          python -c "
          import os, re

          arquivos = [
              f for f in sorted(os.listdir('.')) 
              if f.lower().endswith('.html') and f.lower() != 'index.html'
          ]

          linhas_js = [f\"      '{arq}'\" for arq in arquivos]
          bloco_novo = ',\n'.join(linhas_js)

          with open('index.html', 'r', encoding='utf-8') as f:
              conteudo = f.read()

          padrao = r'/\* INICIO_LISTA \*/.*?/\* FIM_LISTA \*/'
          substituicao = f'/* INICIO_LISTA */\n{bloco_novo}\n      /* FIM_LISTA */'

          conteudo_atualizado = re.sub(padrao, substituicao, conteudo, flags=re.DOTALL)

          with open('index.html', 'w', encoding='utf-8') as f:
              f.write(conteudo_atualizado)
          "

      - name: 2. Gerar simulados.json com nomes amigáveis para exibição
        run: |
          python -c "
          import os, json, re

          simulados = []
          for arq in sorted(os.listdir('.')):
              if arq.lower().endswith('.html') and arq.lower() != 'index.html':
                  nome_sem_ext = arq.replace('.html', '')
                  partes = nome_sem_ext.split('-')

                  # Formata cada parte do nome com letra maiúscula (ex: 'farmaco' -> 'Farmaco')
                  titulo_formatado = ' '.join([p.upper() if len(p) <= 2 else p.capitalize() for p in partes])

                  simulados.append({
                      'arquivo': arq,
                      'titulo_exibicao': titulo_formatado
                  })

          with open('simulados.json', 'w', encoding='utf-8') as f:
              json.dump(simulados, f, ensure_ascii=False, indent=2)
          "

      - name: Salvar alterações no repositório
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html simulados.json
          git commit -m "auto: sincroniza simulados [skip ci]" || echo "Sem alterações para salvar"
          git push
